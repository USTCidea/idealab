<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能决策博弈与数字经济创新实验室</title>
    <script>
      // GitHub Pages SPA routing solution
      const pathName = window.location.pathname;

      if (pathName.startsWith("/idealab/") && pathName !== "/idealab/") {
        sessionStorage.setItem(
          "pathToRedirect",
          pathName + window.location.search + window.location.hash
        );
        window.location.replace("/idealab/");
      } else {
        window.location.replace("/idealab/");
      }
    </script>
  </head>
  <body>
    <div>Redirecting...</div>
  </body>
</html>
